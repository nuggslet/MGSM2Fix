;;;;;;;;;; General ;;;;;;;;;;

[External Resolution]
; Enter your chosen resolution.
; You can leave these at 0 if you want your desktop resolution used instead.
Enabled = true
Width = 0
Height = 0
Windowed = false
Borderless = true

[Internal Resolution]
; MGS1 only: Set Widescreen to 'true' to enable proper widescreen without horizontal stretching.
; (Note: the in-game settings must also be set to 'Fullscreen' for this to take effect, and won't kick in until you exit the settings menu).
Widescreen = false
; MGS1 only: Set Borderless to 'true' to disable NTSC letterboxing (black bars at the top and bottom of the screen.)
Borderless = false
; MGS1 only: Set Enabled to 'true' to override high resolution with a custom value instead of the in-game "High" (4x) and "Max" (8x).
; (Note: the in-game settings must also be set to a high resolution mode for this to take effect).
Enabled = false
; Leave the height at 0 if you wish to use the external resolution.
Height = 0

[Input]
; MGS1 only: Remove the hardcoded deadzone applied to the analog stick.
RemoveDeadzone = true

[Fixes]
; System specific fix: If your game's main menu shows graphical corruption,
; Enable this to force Windows compatibility settings to disable Fullscreen Optimization.
; This writes to HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers
; Equivalent to: right click the game's .exe -> Properties -> Compatibility -> "Disable Fullscreen Optimizations"
DisableWindowsFullscreenOptimization = false
; Uncomment this disable the Windows slideshow / spotlight mode warning.
;DisableWindowsSlideshowWarning = true

[Launcher]
; Skips the warnings / logos on start.
SkipNotice = true
; MGS1 only: Starts the game directly with the previously saved settings and game version.
; Change the game version/settings by going back to the game selection menu via the in-game pause menu.
StartGame = false

[Patches]
; MGS1 only: Enable the installed Integral English PPF sets, independently
; for the two story discs and the VR disc. These do not install patch files.
; EnglishText below selects Integral's own subtitle language separately.
; Restart the game after changing any of these patch-file settings.
IntegralEnglishPatch = true
IntegralVREnglishPatch = true
; Integral VR: Correct the grenade decal and briefing to four seconds.
; Included in the Integral English collection package with JSON companions. The loader chooses
; Japanese/English automatically; false also restores the English briefing's
; original 5. This changes displayed information, never the gameplay timer.
GrenadeDelayFix = true
; MGS1 only: Reverts the Master Collection texture swap for Johnny's underpants.
RemoveUnderpants = true
; MGS1 only: Restores the mosaic blur effect on Johnny from original western releases.
EnableMosaic = true
; MGS1 only: Reverts the Master Collection texture swaps for ghost exorcism.
RestoreGhosts = true
; MGS1 only: Reverts the Master Collection texture swaps for medicine items.
RestoreMedicine = true
; PSX: A textured polygon one pixel tall whose texture coordinates span more
; than one texel row is drawn by the PlayStation GPU with the top row; the
; collection's renderer picks another. MGS1's briefing draws its connector
; lines that way and they come out faint here while hardware draws them
; bright. This snaps such polygons to the row (or column) hardware uses and
; leaves everything else alone.
ThinTexturedQuads = true

; MGS1 only: The collection replaces the game's Option -> SCREEN help texture
; with a four-line version, dropping the line that names the button used to go
; back - fair enough, since that button's name is not the same on every
; platform. What it gets wrong is re-centring the four lines it keeps in the
; same canvas: that draws them 12 pixels below where the game draws them, and
; leaves a flat black band over the grey ramp above them.
;   fixed      - the collection's four lines, put back where the game draws
;                them, and no band
;   original   - the game's own six lines, in that same place
;   collection - leave the collection's version exactly as it is
; Only MGS1 (USA) is covered so far; other versions need their own offsets.
BrightnessText = fixed

; MGS1 only: The collection rewrites the game's whole 16-bit configuration word
; every frame to impose its button-type setting, from a copy it read a moment
; earlier. Anything the game wrote to that word in between - the language,
; caption, sound, vibration, radar and first-person-view settings all live
; there - is lost. This re-reads the word at write time and applies only the
; bits the collection changed, so the game's own settings survive.
PreserveConfiguration = true

; MGS1 only: Disables the HD font system in high resolution modes.
DisableFont = false

; MGS1 only: !ADVANCED OPTION! Master toggle for *all* RAM patches.
; May interfere with achievements!
DisableRAM = false
; MGS1 only: !ADVANCED OPTION! Master toggle for *all* CD-ROM patches.
; May interfere with achievements!
DisableCDROM = false

[Game]
; Optional test aids. Require their corresponding installed PPFs; restart
; after changing these. False skips the PPF even when it is installed.
; VR missions: Integral and USA VR; reveals every mission without recording
; it as genuinely cleared. Extras/movies: Integral VR only.
UnlockVRMissions = false
UnlockVRExtras = false
UnlockVRMovies = false
; Integral/USA story discs: title bonuses (PHOTO ALBUM, DEMO THEATER,
; EXTREME, and Integral's additional clear-game menu). Separate from
; UnlockBriefing below. Does not erase any progress already in a save.
UnlockTitleBonuses = false

; MGS1 only: Enables the in-game developer menu (stage select).
StageSelect = false

; MGS1 only (Integral): Selects English text in the game's own option screen.
; Integral starts with Japanese text selected; this holds the game's language
; setting to English while the title screens are up, so a new game begins in
; English. You can still switch it in the game's option screen afterwards -
; that choice is followed. If anything other than the option screen clears the
; setting (starting 1P MODE has been seen to do this), English is restored and
; the event is logged. Has no effect on any other version.
EnglishText = true




[Update Notifications]  
; If set to true, MGSM2Fix will notify you when launching the game if a new MGSM2Fix update is available for download.
CheckForUpdates = true
; If you want console notification when starting the game if a MGSM2Fix update is available.
; Update notifications will still be printed to the log file when set to false.
ConsoleNotifications = true

;;;;;;;;;; Developer ;;;;;;;;;;

[Squirrel Debugger]
; Injects SQDbg into the Squirrel VM.
; Advanced option, leave it disabled if you just want to play the game.
Enabled = false
Port = 27615
AutoUpdate = true
Exclusive = false

[Tracing]
; Enables tracing of Squirrel scripts to the log file.
Level = 0
; Enables tracing of Squirrel native calls to the log file.
NativeLevel = 0
; Enables tracing of spammy emulator hooks to the log file.
EmulatorLevel = 0
; Enables a command prompt "developer console" window to display the log.
Console = false
